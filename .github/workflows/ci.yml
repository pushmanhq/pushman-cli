name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit to qualify for a release
        required: true
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify generated API client
        run: |
          go generate ./internal/api
          git diff --exit-code -- internal/api/api.gen.go
      - name: Test Homebrew Formula renderer
        run: sh scripts/test-render-homebrew-formula.sh
      - name: Lint release scripts
        run: shellcheck scripts/render-homebrew-formula.sh scripts/test-render-homebrew-formula.sh
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build
        run: go build -trimpath ./cmd/pushman

  portability:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        if: runner.os != 'Windows'
        run: go test ./...
      - name: Record native Windows environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $arch = go env GOARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = if ('${{ matrix.os }}' -eq 'windows-11-arm') { 'arm64' } else { 'amd64' }
          if ($arch -ne $expected) { throw "Expected native $expected Go, got $arch" }
          $expectedOS = if ($expected -eq 'arm64') { 'Arm64' } else { 'X64' }
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne $expectedOS) {
            throw "Expected native $expectedOS Windows"
          }
          [pscustomobject]@{
            Image = $env:ImageOS
            ImageVersion = $env:ImageVersion
            Windows = [System.Environment]::OSVersion.Version
            OSArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
            GoArchitecture = $arch
            PowerShell = $PSVersionTable.PSVersion
          } | Format-List
      - name: Native Windows tests (credentials, shells, console, and MCP)
        if: runner.os == 'Windows'
        env:
          PUSHMAN_TEST_NATIVE_KEYRING: '1'
        run: go test -v ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        if: runner.os != 'Windows'
        run: go build -trimpath ./cmd/pushman
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags '-s -w -X main.version=0.0.1-ci' -o .bin/pushman.exe ./cmd/pushman
      - name: PowerShell 7 smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\windows-smoke.ps1 -Executable .\.bin\pushman.exe
      - name: Windows PowerShell 5.1 smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\windows-smoke.ps1 -Executable .\.bin\pushman.exe
      - name: cmd smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          ver
          .bin\pushman.exe version
          if errorlevel 1 exit /b 1
          .bin\pushman.exe help
          if errorlevel 1 exit /b 1
          .bin\pushman.exe --not-a-pushman-flag
          if %ERRORLEVEL% NEQ 2 exit /b 1
          .bin\pushman.exe self-update
          if %ERRORLEVEL% NEQ 1 exit /b 1
          exit /b 0
      - name: Verify and execute the published Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arch = if ('${{ matrix.os }}' -eq 'windows-11-arm') { 'arm64' } else { 'x86_64' }
          .\scripts\test-windows-release.ps1 -Tag v0.4.2 -Architecture $arch -CandidateExecutable .\.bin\pushman.exe
      - name: Qualify Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ('${{ matrix.os }}' -eq 'windows-11-arm') { 'arm64' } else { 'x86_64' }
          $compiler = .\scripts\ensure-inno-setup.ps1
          $candidate = .\scripts\build-windows-installer.ps1 -Version 0.0.1-ci -Architecture $arch -Executable .bin\pushman.exe -Compiler $compiler
          .\scripts\test-windows-installer.ps1 -Installer $candidate.Installer -Executable .bin\pushman.exe -Version 0.0.1-ci -Architecture $arch -Compiler $compiler
      - name: Save qualified Windows candidate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-candidate-${{ matrix.os }}
          path: dist/windows/*_setup.exe
          if-no-files-found: error
          retention-days: 7

  winget-manifests:
    name: Validate WinGet manifests
    needs: portability
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-candidate-*
          path: windows-dist
          merge-multiple: true
      - name: Prepare pinned Microsoft WinGet client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\ensure-winget.ps1
      - name: Validate manifests against Microsoft schemas and WinGet
        shell: pwsh
        run: .\scripts\new-winget-manifests.ps1 -Tag v0.0.1-ci -InstallerDirectory windows-dist -RequireWinget
